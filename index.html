
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoForce Performance</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              autoforce: {
                blue: '#1440FF',
                darkBlue: '#001A91',
                darkest: '#000D3D',
                dark: '#00061A',
                sidebar: '#00040F',
                secondary: '#0027D4',
                grey: '#4E5265',
                lightGrey: '#C7CDE9',
                accent: '#FFA814',
                yellow: '#FFC414',
                black: '#00020A',
                success: '#00C851',
                danger: '#ff4444'
              }
            },
            fontFamily: {
              sans: ['Poppins', '"Titillium Web"', 'sans-serif'],
              display: ['Poppins', '"Manrope"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
            },
            animation: {
              'spin-slow': 'spin 3s linear infinite',
              'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
              'fade-in-down': 'fadeInDown 0.5s ease-out forwards',
              'fade-in-right': 'fadeInRight 0.5s ease-out forwards',
              'fade-in': 'fadeIn 0.25s ease-out forwards',
              'fade-out': 'fadeOut 0.25s ease-in forwards',
              'slide-in-right': 'slideInRight 0.35s ease-out forwards',
              'slide-out-right': 'slideOutRight 0.25s ease-in forwards',
              'shake': 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both'
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              fadeOut: {
                '0%': { opacity: '1' },
                '100%': { opacity: '0' },
              },
              slideInRight: {
                '0%': { opacity: '0', transform: 'translateX(16px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              slideOutRight: {
                '0%': { opacity: '1', transform: 'translateX(0)' },
                '100%': { opacity: '0', transform: 'translateX(16px)' },
              },
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInDown: {
                '0%': { opacity: '0', transform: 'translateY(-10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeInRight: {
                '0%': { opacity: '0', transform: 'translateX(10px)' },
                '100%': { opacity: '1', transform: 'translateX(0)' },
              },
              shake: {
                '10%, 90%': { transform: 'translate3d(-1px, 0, 0)' },
                '20%, 80%': { transform: 'translate3d(2px, 0, 0)' },
                '30%, 50%, 70%': { transform: 'translate3d(-4px, 0, 0)' },
                '40%, 60%': { transform: 'translate3d(4px, 0, 0)' }
              }
            }
          }
        }
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Poppins:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Titillium+Web:wght@300;400;600;700;900&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <!-- Design System -->
    <style>
      /* ── CSS Variables — Light theme (default) ───────────────────────── */
      :root {
        --af-900: #242F84; --af-800: #2531A8; --af-700: #273BCE;
        --af-600: #3754E2; --af-500: #456CEC; --af-400: #6892F2;
        --af-300: #98B7F8; --af-200: #C2D3FB; --af-100: #DDE6FC; --af-50: #F0F4FE;

        --sl-50:#F8FAFC; --sl-100:#F1F5F9; --sl-200:#E2E8F0; --sl-300:#CBD5E1;
        --sl-400:#94A3B8; --sl-500:#64748B; --sl-600:#475569; --sl-700:#334155;
        --sl-800:#1E293B; --sl-900:#0F172A;

        --green-50:#F0FDF4; --green-100:#DCFCE7; --green-500:#22C55E;
        --green-600:#16A34A; --green-700:#15803D;
        --yellow-50:#FEFCE8; --yellow-500:#EAB308; --yellow-600:#CA8A04; --yellow-700:#A16207;
        --red-50:#FEF2F2; --red-100:#FEE2E2; --red-500:#EF4444;
        --red-600:#DC2626; --red-700:#B91C1C;

        --bg-app:      #FAFBFC;
        --bg-surface:  #FFFFFF;
        --bg-elevated: #FFFFFF;
        --bg-subtle:   var(--sl-50);
        --bg-muted:    var(--sl-100);
        --bg-hover:    var(--sl-100);
        --bg-sidebar:  #0B1230;

        --fg-primary:   var(--sl-900);
        --fg-secondary: var(--sl-700);
        --fg-muted:     var(--sl-500);
        --fg-subtle:    var(--sl-400);

        --border:        var(--sl-200);
        --border-strong: var(--sl-300);
        --border-subtle: #EEF2F7;

        --accent:       var(--af-600);
        --accent-hover: var(--af-700);
        --accent-soft:  var(--af-50);

        --shadow-xs: 0 1px 0 rgba(15,23,42,.04);
        --shadow-sm: 0 1px 2px rgba(15,23,42,.04), 0 0 0 1px rgba(15,23,42,.04);
        --shadow-md: 0 4px 12px -2px rgba(15,23,42,.06), 0 2px 4px -2px rgba(15,23,42,.04);

        --r-sm:4px; --r-md:6px; --r-lg:8px; --r-xl:12px; --r-2xl:16px; --r-full:9999px;
        --card-pad: 20px; --row-h: 40px;
      }

      /* ── Dark theme ──────────────────────────────────────────────────── */
      [data-theme="dark"] {
        --bg-app:      #0A0F22;
        --bg-surface:  #0F1631;
        --bg-elevated: #131B3A;
        --bg-subtle:   #0E1430;
        --bg-muted:    #1A2348;
        --bg-hover:    #1A2348;
        --bg-sidebar:  #060A1C;

        --fg-primary:   #F1F5F9;
        --fg-secondary: #CBD5E1;
        --fg-muted:     #94A3B8;
        --fg-subtle:    #64748B;

        --border:        #1F284A;
        --border-strong: #2A3560;
        --border-subtle: #182149;

        --accent:       var(--af-500);
        --accent-hover: var(--af-400);
        --accent-soft:  rgba(69,108,236,.12);

        --shadow-xs: 0 1px 0 rgba(0,0,0,.2);
        --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.03), inset 0 1px 0 rgba(255,255,255,.04);
        --shadow-md: 0 10px 28px rgba(0,0,0,.4), 0 1px 2px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.04);
      }

      [data-theme="dark"] .text-autoforce-grey { color: #64748B !important; }
      [data-theme="dark"] .text-autoforce-lightGrey { color: #94A3B8 !important; }
      [data-theme="dark"] .border-autoforce-grey\/20 { border-color: rgba(31,40,74,.88) !important; }
      [data-theme="dark"] .border-autoforce-grey\/25 { border-color: rgba(42,53,96,.72) !important; }

      .revenue-entry-modal {
        background: var(--bg-surface);
        color: var(--fg-primary);
        border-color: var(--border);
      }
      .revenue-entry-modal .bg-autoforce-darkest { background-color: var(--bg-surface) !important; }
      .revenue-entry-modal .text-white { color: var(--fg-primary) !important; }
      .revenue-entry-modal .text-autoforce-lightGrey { color: var(--fg-muted) !important; }
      .revenue-entry-modal .text-autoforce-grey { color: var(--fg-subtle) !important; }
      .revenue-entry-modal .border-autoforce-grey\/20,
      .revenue-entry-modal .border-autoforce-grey\/25 { border-color: var(--border) !important; }
      .revenue-entry-modal .divide-autoforce-grey\/20 > :not([hidden]) ~ :not([hidden]) { border-color: var(--border) !important; }
      .revenue-entry-modal .bg-autoforce-grey\/10,
      .revenue-entry-modal .bg-autoforce-grey\/15 { background-color: var(--bg-muted) !important; }
      .revenue-entry-mrr { background: var(--green-50); }
      [data-theme="dark"] .revenue-entry-mrr { background: rgba(34,197,94,.10); }

      /* ── Base ────────────────────────────────────────────────────────── */
      *, *::before, *::after { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: 'Poppins', 'Titillium Web', system-ui, sans-serif;
        font-size: 14px; line-height: 1.5;
        background: var(--bg-app);
        color: var(--fg-primary);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        transition: background .2s, color .2s;
      }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; }

      /* ── Scrollbar ───────────────────────────────────────────────────── */
      ::-webkit-scrollbar { width: 6px; height: 6px; }
      ::-webkit-scrollbar-track { background: var(--bg-subtle); }
      ::-webkit-scrollbar-thumb { background: var(--af-400); border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--af-600); }

      /* ── Cards ───────────────────────────────────────────────────────── */
      .ds-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        box-shadow: var(--shadow-xs);
      }
      .ds-card-head {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px var(--card-pad);
        border-bottom: 1px solid var(--border-subtle);
      }
      .ds-card-head .ttl {
        font-size: 13px; font-weight: 600;
        color: var(--fg-primary);
        display: flex; align-items: center; gap: 8px;
      }
      .ds-card-head .ttl .ico { color: var(--fg-muted); }
      .ds-card-pad { padding: var(--card-pad); }

      /* ── KPI tile ────────────────────────────────────────────────────── */
      .ds-kpi {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg);
        padding: 16px 18px;
        display: flex; flex-direction: column; gap: 10px;
        box-shadow: var(--shadow-xs);
        position: relative; overflow: hidden;
        transition: box-shadow .15s, border-color .15s;
      }
      .ds-kpi:hover { box-shadow: var(--shadow-md); border-color: var(--border-strong); }
      .ds-kpi-row { display: flex; align-items: center; justify-content: space-between; }
      .ds-kpi-label {
        font-size: 12px; font-weight: 500;
        color: var(--fg-muted);
        display: flex; align-items: center; gap: 6px;
        text-transform: uppercase; letter-spacing: .04em;
      }
      .ds-kpi-value {
        font-size: 28px; font-weight: 600; letter-spacing: -.02em;
        color: var(--fg-primary);
        font-variant-numeric: tabular-nums;
      }
      .ds-kpi-delta {
        font-size: 12px; font-weight: 500;
        display: inline-flex; align-items: center; gap: 3px;
        padding: 2px 7px; border-radius: var(--r-full);
      }
      .ds-kpi-delta.up   { color: var(--green-700); background: var(--green-50); }
      .ds-kpi-delta.down { color: var(--red-700);   background: var(--red-50); }
      [data-theme="dark"] .ds-kpi-delta.up   { color: #6EE7B7; background: rgba(34,197,94,.12); }
      [data-theme="dark"] .ds-kpi-delta.down { color: #FCA5A5; background: rgba(239,68,68,.12); }
      .ds-kpi-foot { font-size: 11.5px; color: var(--fg-subtle); }
      .ds-kpi-spark { height: 36px; margin: -2px 0; }

      .ds-kpi-accent {
        background: linear-gradient(150deg, var(--af-600), var(--af-800));
        border-color: transparent; color: white;
      }
      .ds-kpi-accent .ds-kpi-label,
      .ds-kpi-accent .ds-kpi-value { color: white; }
      .ds-kpi-accent .ds-kpi-label { color: rgba(255,255,255,.78); }
      .ds-kpi-accent .ds-kpi-foot  { color: rgba(255,255,255,.66); }
      .ds-kpi-accent .ds-kpi-delta.up   { background: rgba(255,255,255,.18); color: white; }
      .ds-kpi-accent .ds-kpi-delta.down { background: rgba(255,255,255,.18); color: white; }

      /* ── Badges ──────────────────────────────────────────────────────── */
      .ds-badge {
        display: inline-flex; align-items: center; gap: 5px;
        height: 22px; padding: 0 8px; border-radius: var(--r-full);
        font-size: 11.5px; font-weight: 500;
        background: var(--bg-muted); color: var(--fg-secondary);
        border: 1px solid transparent; white-space: nowrap;
      }
      .ds-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
      .ds-badge.success { background: var(--green-50); color: var(--green-700); }
      .ds-badge.warning { background: var(--yellow-50); color: var(--yellow-700); }
      .ds-badge.danger  { background: var(--red-50); color: var(--red-700); }
      [data-theme="dark"] .ds-badge.success { background: rgba(34,197,94,.12); color: #6EE7B7; }
      [data-theme="dark"] .ds-badge.warning { background: rgba(234,179,8,.12); color: #FDE68A; }
      [data-theme="dark"] .ds-badge.danger  { background: rgba(239,68,68,.12); color: #FCA5A5; }

      /* ── Tables ──────────────────────────────────────────────────────── */
      .ds-table-wrap {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: var(--r-lg); overflow: hidden;
      }
      .ds-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
      .ds-table thead th {
        text-align: left; font-weight: 500; font-size: 11.5px;
        color: var(--fg-muted); text-transform: uppercase; letter-spacing: .04em;
        padding: 10px 16px;
        background: var(--bg-subtle);
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
      }
      .ds-table tbody td {
        padding: 11px 16px; border-bottom: 1px solid var(--border-subtle);
        color: var(--fg-primary); vertical-align: middle;
      }
      .ds-table tbody tr:last-child td { border-bottom: none; }
      .ds-table tbody tr:hover { background: var(--bg-subtle); }
      .ds-table .num { font-variant-numeric: tabular-nums; text-align: right; }
      .ds-table th.num { text-align: right; }

      /* ── Sidebar nav ─────────────────────────────────────────────────── */
      .ds-nav-item {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 10px; border-radius: var(--r-md);
        color: rgba(255,255,255,.72);
        font-size: 13.5px; font-weight: 500;
        cursor: pointer; border: none; background: transparent;
        width: 100%; text-align: left; position: relative;
        transition: background .12s, color .12s;
      }
      .ds-nav-item:hover { background: rgba(255,255,255,.06); color: white; }
      .ds-nav-item.active {
        background: rgba(55,84,226,.22);
        color: white;
        box-shadow: inset 0 0 0 1px rgba(104,146,242,.18);
      }
      .ds-nav-item.active::before {
        content: "";
        position: absolute; left: -8px; top: 8px; bottom: 8px;
        width: 3px; background: var(--af-400);
        border-radius: 0 3px 3px 0;
      }

      /* ── Inputs (theme-aware) ────────────────────────────────────────── */
      input[type="date"] {
        color-scheme: dark; -webkit-appearance: none; appearance: none;
      }
      [data-theme="light"] input[type="date"] { color-scheme: light; }
      .date-input::-webkit-calendar-picker-indicator { display: none; opacity: 0; cursor: pointer; }

      /* ── Misc utilities ──────────────────────────────────────────────── */
      .glass-panel {
        background: rgba(0,13,61,.7); backdrop-filter: blur(10px);
        border: 1px solid rgba(78,82,101,.3);
      }
      [data-theme="light"] .glass-panel {
        background: rgba(255,255,255,.85);
        border-color: rgba(0,0,0,.08);
      }

      /* ── Compat: old dark tokens → CSS vars (main content only) ────── */
      /* Scoped to .app-content so sidebar (dark background) is unaffected */
      .app-content .bg-autoforce-darkest,
      .app-content .bg-autoforce-dark,
      .app-content .bg-autoforce-sidebar,
      .app-content .bg-autoforce-darkest\/60,
      .app-content .bg-autoforce-darkest\/40 { background: var(--bg-surface) !important; }

      .app-content .border-autoforce-grey\/20,
      .app-content .border-autoforce-grey\/15,
      .app-content .border-autoforce-grey\/10 { border-color: var(--border) !important; }

      .app-content .text-white { color: var(--fg-primary) !important; }
      /* Exception: elements that are themselves colored (buttons etc.) keep white text */
      .app-content .bg-autoforce-blue.text-white,
      .app-content .bg-autoforce-secondary.text-white,
      .app-content [class*="bg-green-"].text-white,
      .app-content [class*="bg-red-"].text-white,
      .app-content [class*="bg-indigo-"].text-white { color: white !important; }
      .app-content .text-autoforce-lightGrey { color: var(--fg-muted) !important; }
      .app-content .text-autoforce-grey { color: var(--fg-subtle) !important; }
      .app-content .text-autoforce-blue { color: var(--accent) !important; }

      .app-content .bg-autoforce-blue { background: var(--accent) !important; }
      .app-content .bg-autoforce-blue\/15,
      .app-content .bg-autoforce-blue\/20 { background: var(--accent-soft) !important; }

      .app-content .bg-autoforce-black\/60,
      .app-content .bg-autoforce-black\/40,
      .app-content .bg-autoforce-black\/30 { background: var(--bg-subtle) !important; }

      .app-content .bg-autoforce-black { background: var(--bg-subtle) !important; }

      .app-content .bg-autoforce-grey\/10 { background: var(--bg-muted) !important; }

      /* Gradient overrides */
      .app-content .bg-gradient-to-br { background-image: none !important; background: var(--bg-surface) !important; }

      /* Placeholder text */
      .app-content .placeholder\:text-autoforce-lightGrey::placeholder { color: var(--fg-subtle) !important; }

      /* Accent (warm yellow) — darken in light mode for contrast */
      .app-content .text-autoforce-accent { color: var(--yellow-600) !important; }

      /* Primary button stays blue — but restore secondary hover correctly */
      .app-content .hover\:bg-autoforce-secondary:hover { background: var(--accent-hover) !important; }

      /* Focus border */
      .app-content .focus\:border-autoforce-blue:focus { border-color: var(--accent) !important; }

      /* Hover overrides */
      .app-content .hover\:text-white:hover { color: var(--fg-primary) !important; }
      .app-content .hover\:border-autoforce-grey\/40:hover { border-color: var(--border-strong) !important; }
      .app-content .hover\:bg-white\/\[0\.02\]:hover { background: var(--bg-hover) !important; }

      /* Dark mode: restore original behavior */
      [data-theme="dark"] .app-content .bg-autoforce-darkest,
      [data-theme="dark"] .app-content .bg-autoforce-dark,
      [data-theme="dark"] .app-content .bg-autoforce-darkest\/60,
      [data-theme="dark"] .app-content .bg-autoforce-darkest\/40,
      [data-theme="dark"] .app-content .bg-autoforce-black,
      [data-theme="dark"] .app-content .bg-autoforce-black\/60,
      [data-theme="dark"] .app-content .bg-autoforce-black\/40,
      [data-theme="dark"] .app-content .bg-autoforce-black\/30 { background: unset !important; }
      [data-theme="dark"] .app-content .bg-gradient-to-br { background-image: unset !important; background: unset !important; }
      [data-theme="dark"] .app-content .text-white { color: unset !important; }
      [data-theme="dark"] .app-content .text-autoforce-lightGrey { color: unset !important; }
      [data-theme="dark"] .app-content .text-autoforce-grey { color: unset !important; }
      [data-theme="dark"] .app-content .border-autoforce-grey\/20,
      [data-theme="dark"] .app-content .border-autoforce-grey\/15,
      [data-theme="dark"] .app-content .border-autoforce-grey\/10 { border-color: unset !important; }
      [data-theme="dark"] .app-content .hover\:bg-white\/\[0\.02\]:hover { background: unset !important; }

      /* ── Animations ──────────────────────────────────────────────────── */
      @keyframes fadeInUp   { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadeInDown { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
      @keyframes fadeIn     { from { opacity:0; } to { opacity:1; } }
      @keyframes fadeOut    { from { opacity:1; } to { opacity:0; } }
      @keyframes slideInRight  { from { opacity:0; transform:translateX(16px); } to { opacity:1; transform:translateX(0); } }
      @keyframes slideOutRight { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(16px); } }
      @keyframes shake { 10%,90%{transform:translate3d(-1px,0,0)} 20%,80%{transform:translate3d(2px,0,0)} 30%,50%,70%{transform:translate3d(-4px,0,0)} 40%,60%{transform:translate3d(4px,0,0)} }
    </style>

</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
